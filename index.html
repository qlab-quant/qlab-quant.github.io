<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Q-Lab | 퀀트 투자 동아리</title>
  <meta name="description" content="돈을 지키는 법을 연구하는 퀀트 투자 동아리 Q-Lab입니다." />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="canonical" href="https://qlab-quant.github.io/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Q-Lab" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:url" content="https://qlab-quant.github.io/" />
  <meta property="og:title" content="Q-Lab | 퀀트 투자 동아리" />
  <meta property="og:description" content="돈을 지키는 법을 연구하는 퀀트 투자 동아리 Q-Lab입니다." />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css?v=202611072152" />
  <script src="js/theme.js?v=202611072152"></script>
  <script src="js/icons.js?v=202611072152"></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <!-- 내비게이션과 모바일 메뉴는 js/common.js가 채운다 -->
  <header class="site-nav" id="site-nav"></header>
  <div class="mobile-menu" id="mobile-menu" inert></div>

  <main id="main">
    <!-- 히어로: 수식과 코드가 모인 지구본 → 스크롤하면 수익률 그래프 (js/hero.js) -->
    <section class="hero" id="top">
      <div class="hero-stage stage" id="hero-stage" data-lens-sticky>
        <canvas class="hero-canvas" id="hero-canvas" aria-hidden="true"></canvas>
        <div class="container hero-inner">
          <p class="eyebrow" data-bind="eyebrow"></p>
          <h1 class="hero-title" data-bind="tagline"></h1>
          <p class="hero-sub" data-bind="description"></p>
          <div class="hero-actions">
            <a class="btn btn-primary hero-cta" href="recruit.html" data-cta data-magnetic>지원하기</a>
            <p class="hero-note" id="hero-note"></p>
          </div>
        </div>
        <p class="hero-chart-label" id="hero-chart-label" aria-hidden="true">
          <span>Q-LAB INDEX</span><span>since founded</span>
        </p>
        <p class="hero-hint" id="hero-hint" aria-hidden="true">
          스크롤하면 수식이 그래프로 바뀌어요 <span data-icon="arrow-right"></span>
        </p>
      </div>
    </section>

    <!-- 숫자 띠 -->
    <section class="stats-band stage" aria-label="숫자로 보는 Q-Lab">
      <div class="container">
        <dl class="stats" id="stats"></dl>
      </div>
    </section>

    <!-- 큰 문구: 스크롤하면 단어가 하나씩 켜진다 -->
    <section class="tagline-section" aria-label="Q-Lab이 하는 일">
      <div class="container">
        <p class="tagline" id="tagline"></p>
      </div>
    </section>

    <!-- 01 소개 -->
    <section class="section section-soft" id="about">
      <div class="container" data-reveal>
        <header class="section-head">
          <span class="section-num">01</span>
          <h2>소개</h2>
        </header>
        <div class="about-grid">
          <div class="about-body" id="about-body"></div>
          <ul class="values" id="values"></ul>
        </div>
      </div>
    </section>

    <!-- 02 활동 -->
    <section class="section" id="activities">
      <div class="container" data-reveal>
        <header class="section-head">
          <span class="section-num">02</span>
          <h2>활동</h2>
          <p>한 학기 동안 이런 활동을 함께합니다.</p>
        </header>
        <ul class="card-grid" id="activity-list"></ul>
      </div>
    </section>

    <!-- 03 프로젝트 -->
    <section class="section section-soft" id="projects">
      <div class="container" data-reveal>
        <header class="section-head">
          <span class="section-num">03</span>
          <h2>프로젝트</h2>
          <p>부원들이 직접 리서치하고 검증한 결과물입니다.</p>
        </header>
        <ul class="project-list" id="project-list"></ul>
      </div>
    </section>

    <!-- 04 멤버 -->
    <section class="section" id="members">
      <div class="container" data-reveal>
        <header class="section-head">
          <span class="section-num">04</span>
          <h2>멤버</h2>
          <p data-bind="memberTerm"></p>
        </header>
        <ul class="member-grid" id="member-list"></ul>
      </div>
    </section>

    <!-- 05 영상 (관리 페이지에서 유튜브 주소를 넣으면 나타난다) -->
    <section class="section section-soft" id="videos" hidden>
      <div class="container" data-reveal>
        <header class="section-head">
          <span class="section-num">05</span>
          <h2>영상</h2>
          <p>세미나와 활동 영상을 유튜브에 올리고 있어요.</p>
        </header>
        <ul class="video-grid" id="video-list"></ul>
        <a class="btn btn-ghost youtube-link" id="youtube-link" target="_blank" rel="noopener" hidden>
          <span data-icon="youtube-logo"></span> 유튜브 채널 보기
        </a>
      </div>
    </section>

    <!-- 마지막 지원 안내 (첫 화면의 버튼과 같은 동작) -->
    <section class="cta-section">
      <div class="container">
        <div class="cta-card spotlight" data-reveal>
          <span class="badge" id="cta-badge"></span>
          <h2 id="cta-title"></h2>
          <p id="cta-period"></p>
          <a class="btn btn-primary" href="recruit.html" data-cta data-magnetic>지원하기</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <!-- 내용은 관리 페이지(admin.html) 또는 js/data.js에서 수정하세요. data.js는 main.js가 불러옵니다. -->
  <script src="js/common.js?v=202611072152"></script>
  <script src="js/hero.js?v=202611072152"></script>
  <script src="js/main.js?v=202611072152"></script>
  <script src="js/effects.js?v=202611072152"></script>
</body>
</html>
