<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>리서치 | Q-Lab</title>
  <meta name="description" content="Q-Lab 부원들이 직접 연구하고 검증한 퀀트 리서치와 코드를 공개합니다." />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Q-Lab" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:title" content="리서치 | Q-Lab" />
  <meta property="og:description" content="Q-Lab 부원들이 직접 연구하고 검증한 퀀트 리서치와 코드를 공개합니다." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="css/style.css?v=202611072152" />
  <script src="js/theme.js?v=202611072152"></script>
  <script src="js/icons.js?v=202611072152"></script>
</head>
<body data-page="research">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-nav" id="site-nav"></header>
  <div class="mobile-menu" id="mobile-menu" inert></div>

  <main id="main">
    <!-- 목록 또는 글 하나 (주소에 ?id= 가 있으면 글) -->
    <section class="section page-section">
      <div class="container" id="research-view" aria-live="polite"></div>
    </section>

    <!-- qlab-quant 조직의 공개 저장소가 자동으로 나타난다 -->
    <section class="section section-soft" id="repos">
      <div class="container" data-reveal>
        <header class="section-head">
          <span class="section-num">CODE</span>
          <h2>코드 저장소</h2>
          <p>리서치에 쓴 코드는 GitHub에 공개해요. 조직에 저장소를 만들면 여기에 자동으로 나타나요.</p>
        </header>
        <ul class="repo-grid" id="repo-list"></ul>
        <a class="btn btn-ghost repo-more" id="org-link" target="_blank" rel="noopener" hidden>
          <span data-icon="github-logo"></span> GitHub에서 모두 보기
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="js/common.js?v=202611072152"></script>
  <script src="js/research.js?v=202611072152"></script>
  <script src="js/effects.js?v=202611072152"></script>
</body>
</html>
