<body data-page="recruit">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-nav" id="site-nav"></header>
  <div class="mobile-menu" id="mobile-menu" inert></div>

  <main id="main">
    <section class="section page-section">
      <div class="container">
        <header class="page-head" data-reveal>
          <span class="section-num">RECRUIT</span>
          <h1>모집</h1>
          <p>전공과 경험은 상관없어요. 데이터로 투자를 공부하고 싶은 분이라면 누구든 환영합니다.</p>
        </header>
        <div class="recruit-card spotlight" data-reveal>
          <div class="recruit-top">
            <div>
              <span class="badge" id="recruit-badge"></span>
              <h2 id="recruit-title"></h2>
              <p class="recruit-period" id="recruit-period"></p>
            </div>
            <a class="btn btn-primary" id="apply-btn" target="_blank" rel="noopener">지원하기</a>
          </div>
          <div class="recruit-grid">
            <div>
              <h3>이런 분을 찾습니다</h3>
              <ul class="check-list" id="recruit-target"></ul>
            </div>
            <div>
              <h3>선발 절차</h3>
              <ol class="steps" id="recruit-steps"></ol>
            </div>
          </div>
        </div>
        <div class="faq" data-reveal>
          <h3>자주 묻는 질문</h3>
          <div class="faq-list" id="faq-list"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
